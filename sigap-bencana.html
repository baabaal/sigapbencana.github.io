/* =========================================================
   CARA MENGHUBUNGKAN BERKAS DARI GOOGLE DRIVE
   ---------------------------------------------------------
   Singkatnya: CUKUP TEMPEL TAUTANNYA. Berkas TIDAK perlu
   diunduh atau diletakkan di folder web. Kode di bawah akan
   otomatis mengubah tautan berbagi Drive menjadi tautan yang
   benar untuk dibuka atau diunduh.

   LANGKAH 1 — Atur izin berkas di Google Drive
     Klik kanan berkas > "Bagikan" > pada "Akses Umum" pilih
     "Siapa saja yang memiliki link" > peran "Pelihat".
     ⚠ Bila langkah ini dilewati, guru lain akan melihat
       halaman "Anda memerlukan akses".

   LANGKAH 2 — Salin tautannya
     Klik "Salin link". Bentuknya kira-kira begini:
     https://drive.google.com/file/d/1AbCdEfGhIjKlMnOpQrStUv/view?usp=sharing

   LANGKAH 3 — Tempel ke dalam F() sebagai isian ketiga
     Sebelum : F('LKPD: Maze Tempat Aman','lkpd')
     Sesudah : F('LKPD: Maze Tempat Aman','lkpd','https://drive.google.com/file/d/1AbCdEfGhIjKlMnOpQrStUv/view?usp=sharing')

   LANGKAH 4 (opsional) — Pilih perilaku tombol
     Bawaannya, berkas TIDAK langsung terunduh — tautan dibuka
     dulu sebagai pratinjau di tab baru (guru bisa lihat isinya,
     lalu unduh sendiri lewat tombol unduh milik Google Drive).
     Isian keempat bisa dipakai untuk mengubah perilaku itu:
       'preview'  -> buka pratinjau di tab baru   (bawaan)
       'download' -> berkas langsung terunduh
     Contoh bila ingin langsung unduh tanpa pratinjau:
       F('Video Animasi Banjir','video', 'https://...', 'download')

   CATATAN JENIS BERKAS
     • PDF / gambar / video / zip  -> 'preview' maupun
       'download' keduanya berfungsi.
     • Google Docs, Slides, Sheets -> harus pakai 'preview'.
       Berkas jenis ini tidak bisa diunduh lewat tautan
       langsung. Bila ingin bisa diunduh, ubah dulu menjadi
       PDF di Drive (File > Unduh > PDF), unggah ulang
       PDF-nya, lalu pakai tautan PDF itu.
     • Tautan YouTube boleh ditempel apa adanya.
     • Tautan FOLDER Drive juga boleh, otomatis dibuka di
       tab baru.

   Berkas yang belum diberi tautan tetap aman: tombolnya
   menampilkan pesan bahwa berkas belum tersedia.
   ========================================================= */

function F(name, type, url, mode){
  return {name, type, url: url || '', mode: mode || 'preview'};
}

/* Mengubah tautan berbagi Google Drive menjadi tautan langsung.
   Tautan non-Drive (YouTube, situs lain) dibiarkan apa adanya. */
function resolveURL(url, mode){
  if(!url) return '';
  if(!/drive\.google\.com|docs\.google\.com/.test(url)) return url;
  if(/\/folders\//.test(url)) return url;              // folder: buka apa adanya
  if(/docs\.google\.com/.test(url)) return url;        // Docs/Slides/Sheets: buka apa adanya

  const m = url.match(/\/d\/([A-Za-z0-9_-]{10,})/) || url.match(/[?&]id=([A-Za-z0-9_-]{10,})/);
  if(!m) return url;
  const id = m[1];
  return mode === 'preview'
    ? `https://drive.google.com/file/d/${id}/view`
    : `https://drive.google.com/uc?export=download&id=${id}`;
}

function renderFileCard(f, c, d){
  const href = resolveURL(f.url, f.mode);
  const action = f.mode === 'preview' ? '🔗 Buka' : '📥 Unduh';
  const inner = `
    <span class="text-xl">${FILE_ICON[f.type]}</span>
    <span class="flex-1 min-w-0">
      <span class="block text-sm font-700 text-ink truncate">${f.name}</span>
      <span class="block text-[11px] text-inkfaint">${FILE_LABEL[f.type]}</span>
    </span>
    <span class="text-xs font-700 ${href ? c.text : 'text-inkfaint'}">${href ? action : '⏳ Segera'}</span>`;
  const cls = "flex items-center gap-3 rounded-2xl border border-ink/10 hover:"+c.border+" bg-cream/60 hover:bg-white transition p-3.5 text-left w-full";
  return href
    ? `<a href="${href}" target="_blank" rel="noopener" class="${cls}">${inner}</a>`
    : `<button data-download data-file="${f.name}" data-type="${f.type}" data-color="${d.theme}" class="${cls}">${inner}</button>`;
}

      ${list.map(f=>renderFileCard(f, c, d)).join('')}

  </div>`;
}

      <button class="w-full flex items-center gap-4 text-left p-5 sm:p-6" data-accordion="${i}">
        <span class="shrink-0 w-9 h-9 rounded-full ${c.bg} text-white font-heading font-700 flex items-center justify-center">${i+1}</span>
        <span class="flex-1 min-w-0">
          <span class="block font-heading font-700 text-ink">${SYN_LABELS[i].id}</span>
          <span class="block text-xs text-inkfaint uppercase tracking-wide">${SYN_LABELS[i].en}</span>
        </span>
        <span class="text-inkfaint acc-caret transition-transform">⌄</span>
      </button>
      <div class="acc-panel hidden px-5 sm:px-6 pb-6 space-y-5">
        <p class="text-sm text-inkfaint max-w-xl">${s.tujuan}</p>
        ${renderFileGroup('Materi', '📚', s.materi, c, d)}
        ${renderFileGroup('LKPD', '📝', s.lkpd, c, d)}
      </div>
    </div>`).join('');

  return intro + `
  <section class="max-w-6xl mx-auto px-6 pb-16">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
      <div class="flex flex-wrap items-center gap-3">
        <button data-nav="disasters" class="text-sm font-700 px-4 py-2.5 rounded-full border border-ink/15 bg-white hover:border-sky hover:text-sky-dark transition">← Kembali ke materi</button>
        <button data-nav="landing" class="text-sm font-700 px-4 py-2.5 rounded-full border border-ink/15 bg-white hover:border-sky hover:text-sky-dark transition">← Beranda</button>
      </div>
      ${(()=>{
        const packHref = resolveURL(PACK_LINKS[state.disasterKey], 'preview');
        const packCls = `text-sm font-700 px-4 py-2.5 rounded-full ${c.bg} text-white hover:opacity-90 transition`;
        return packHref
          ? `<a href="${packHref}" target="_blank" rel="noopener" class="${packCls}">📦 Buka Paket Lengkap RPP</a>`
          : `<button data-download data-file="Paket Lengkap RPP &amp; Modul ${d.name}" data-type="doc" data-color="${d.theme}" class="${packCls}">📦 Unduh Paket Lengkap RPP</button>`;
      })()}
    </div>
    <div class="space-y-3">${items}</div>
  </section>`;
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  document.body.className = 'antialiased mode-guru';

  let content = '';
  if(state.view==='landing') content = viewLanding();
  else if(state.view==='disasters') content = viewDisasters();
  else if(state.view==='partners') content = viewPartners();
  else if(state.view==='about') content = viewAbout();
  else if(state.view==='disaster') content = viewDisaster();

  root.innerHTML = headerHTML() + `<div class="fade-up">${content}</div>` + footerHTML();
  bindEvents();
}

function footerHTML(){
  if(state.view==='landing') return `
  <footer class="max-w-6xl mx-auto px-6 pb-10 text-center text-xs text-inkfaint">
    SIGAP BENCANA — Model Pembelajaran Mitigasi &amp; Kesiapsiagaan Bencana untuk PAUD
  </footer>`;
  return `
  <footer class="max-w-6xl mx-auto px-6 py-10 text-center text-xs text-inkfaint">
    🛟 SIGAP BENCANA · untuk guru PAUD dan mitra siaga
    <span class="opacity-40 mx-1.5">·</span>
    <button data-nav="about" class="font-700 hover:text-ink hover:underline">Tim Pengembang</button>
  </footer>`;
}

/* =========================================================
   EVENTS
   ========================================================= */
function bindEvents(){
  root.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const nav = el.getAttribute('data-nav');
      if(nav==='pick-mode'){ go('disasters', {mode:'guru'}); }
      else if(nav==='landing'){ go('landing', {mode:'guru', disasterKey:null}); }
      else if(nav==='disasters'){ go('disasters', {mode:'guru'}); }
      else if(nav==='partners'){ go('partners', {mode:'guru'}); }
      else if(nav==='about'){ go('about', {mode:'guru', disasterKey:null}); }
      else if(nav==='disaster'){ go('disaster', {mode:'guru', disasterKey:el.getAttribute('data-key')}); }
    });
  });

  root.querySelectorAll('[data-accordion]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const panel = btn.parentElement.querySelector('.acc-panel');
      const caret = btn.querySelector('.acc-caret');
      const isHidden = panel.classList.contains('hidden');
      panel.classList.toggle('hidden');
      caret.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
    });
  });

  root.querySelectorAll('[data-download]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      openDownloadModal(btn.getAttribute('data-file'), btn.getAttribute('data-type'), btn.getAttribute('data-color'));
    });
  });
}

/* =========================================================
   DOWNLOAD MODAL (simulasi)
   ========================================================= */
function openDownloadModal(filename, type, colorKey){
  const c = themeColors(colorKey || 'sky');
  const tpl = document.getElementById('tpl-download-modal').content.cloneNode(true);
  const panel = tpl.querySelector('[data-modal-panel]');
  panel.innerHTML = `
    <div class="flex items-start gap-4">
      <span class="w-14 h-14 rounded-2xl ${c.bgLight} flex items-center justify-center text-2xl shrink-0">${FILE_ICON[type]||'📄'}</span>
      <div class="min-w-0">
        <p class="text-xs font-700 ${c.text} uppercase tracking-wide">${FILE_LABEL[type]||'Berkas'}</p>
        <h3 class="font-heading text-lg font-700 text-ink leading-snug">${filename}</h3>
      </div>
    </div>
    <div class="mt-5 rounded-2xl bg-sun-light border border-sun/40 p-4">
      <p class="text-sm font-700 text-sun-ink">Berkas belum dihubungkan</p>
      <p class="mt-1.5 text-sm text-ink/75 leading-relaxed">
        Tautan Google Drive untuk berkas ini belum diisi. Unggah berkas ke Drive,
        atur izin berbagi ke <span class="font-700">"Siapa saja yang memiliki link"</span>,
        lalu tempel tautannya pada berkas ini.
      </p>
    </div>
    <button data-modal-close class="mt-6 w-full rounded-full py-3 font-700 text-white ${c.bg} hover:opacity-90 transition">Tutup</button>
  `;
  document.body.appendChild(tpl);
  const rootEl = document.body.lastElementChild;

  function closeModal(){ rootEl.remove(); }
  rootEl.querySelector('[data-modal-backdrop]').addEventListener('click', closeModal);
  rootEl.querySelector('[data-modal-close]').addEventListener('click', closeModal);
  document.addEventListener('keydown', function esc(e){ if(e.key==='Escape'){ closeModal(); document.removeEventListener('keydown', esc); } });
}

render();
</script>
</body>
</html>
